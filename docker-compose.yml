services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: dm_service
      POSTGRES_USER: dm
      POSTGRES_PASSWORD: dm
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dm -d dm_service"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/dm_service
      DB_USER: dm
      DB_PASSWORD: dm
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
