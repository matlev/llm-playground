spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dm_service}
    username: ${DB_USER:dm}
    password: ${DB_PASSWORD:dm}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [corr:%X{correlationId:-none}]"
